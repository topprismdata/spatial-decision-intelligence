[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spatial-decision-intelligence"
version = "2.1.0"
description = "The trusted spatial world model integrity layer and decision readiness gate for enterprise decision engines."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "TopPrism Data", email = "research@topprism.ai" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: GIS",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "shapely>=2.0.0",
    "pandas>=2.0.0",
    "numpy>=1.23.0",
    "openpyxl>=3.1.0",
    "pydantic>=2.0.0",
    "fastembed>=0.2.0",
    "onnxruntime>=1.15.0",
    "torch>=2.0.0",
    "transformers>=4.30.0",
    "scikit-image>=0.20.0",
    "Pillow>=9.5.0",
    "click>=8.0.0"
]

[project.scripts]
spatial-di = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
